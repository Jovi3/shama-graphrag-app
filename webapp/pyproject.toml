[project]
name = "unified-copilot"
version = "1.0.0"
description = ""
authors = [
    {name = "GraphRAG team"},
]
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "streamlit==1.43.0",
    "altair~=5.3",
    "streamlit-agraph~=0.0.45",
    "st-tabs~=0.1",
    "spacy~=3.8",
    "graphrag",
]

[project.optional-dependencies]
dev = [
    "poethepoet~=0.26",
    "ipykernel~=6.29",
    "pyright~=1.1",
    "ruff~=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.poe.tasks]
start = "streamlit run app/home_page.py"
start_prod = "streamlit run app/home_page.py --server.port=8501 --server.address=0.0.0.0"

[tool.pyright]
include = ["app"]
exclude = ["**/node_modules", "**/__pycache__"]

[tool.uv.sources]
graphrag = { git = "https://github.com/s-sajid-ali/graphrag.git", branch = "bugfix/lancedb_uri_parse", subdirectory = "packages/graphrag"  }
